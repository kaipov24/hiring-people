services:
  mongodb:
    image: mongo:7
    container_name: inclusive-hire-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: inclusive_hire
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongodb_password
    secrets:
      - mongodb_password
    volumes:
      - mongodb_data:/data/db
    networks:
      - inclusive_hire_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  mailpit:
    image: axllent/mailpit:v1.20
    container_name: inclusive-hire-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - inclusive_hire_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    image: ghcr.io/kaipov24/inclusive-hire-api:latest
    container_name: inclusive-hire-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_USERNAME: inclusive_hire
      MONGODB_DATABASE: inclusive_hire
      MONGODB_PASSWORD_FILE: /run/secrets/mongodb_password
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-false}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
      SMTP_CONNECTION_TIMEOUT_MS: ${SMTP_CONNECTION_TIMEOUT_MS:-10000}
      SMTP_SOCKET_TIMEOUT_MS: ${SMTP_SOCKET_TIMEOUT_MS:-30000}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-inclusive-hire <no-reply@inclusive-hire.local>}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
    secrets:
      - mongodb_password
      - jwt_secret
    volumes:
      - api_uploads:/app/uploads
    networks:
      - inclusive_hire_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      mongodb:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  web:
    image: ghcr.io/kaipov24/inclusive-hire-web:latest
    container_name: inclusive-hire-web
    restart: unless-stopped
    networks:
      - inclusive_hire_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    container_name: inclusive-hire-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - inclusive_hire_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  mongodb_data:
  api_uploads:

networks:
  inclusive_hire_net:
    driver: bridge

secrets:
  mongodb_password:
    file: ./secrets/mongodb_password
  jwt_secret:
    file: ./secrets/jwt_secret
