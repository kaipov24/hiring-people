name: Deploy laptop

on:
  workflow_run:
    workflows:
      - Deploy images
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: laptop-deploy
  cancel-in-progress: true

env:
  DEPLOY_DIR: /opt/inclusive-hire

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on:
      - self-hosted
      - linux
      - inclusive-hire-laptop

    steps:
      - name: Checkout deploy files
        uses: actions/checkout@v4

      - name: Check Docker
        run: |
          docker version
          docker compose version

      - name: Sync deploy files
        run: |
          mkdir -p "$DEPLOY_DIR"
          mkdir -p "$DEPLOY_DIR/secrets"
          cp -R deploy/. "$DEPLOY_DIR/"
          chmod +x "$DEPLOY_DIR"/scripts/*.sh

      - name: Write runtime environment
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://inclusive-hire.org.kg' }}
          PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL || 'https://app.inclusive-hire.org.kg' }}
          VITE_APP_BASE_URL: ${{ vars.VITE_APP_BASE_URL || vars.PUBLIC_APP_URL || 'https://app.inclusive-hire.org.kg' }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          JWT_EXPIRES_IN: ${{ vars.JWT_EXPIRES_IN || '8h' }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'mailpit' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '1025' }}
          SMTP_SECURE: ${{ vars.SMTP_SECURE || 'false' }}
          SMTP_REQUIRE_TLS: ${{ vars.SMTP_REQUIRE_TLS || 'false' }}
          SMTP_TLS_REJECT_UNAUTHORIZED: ${{ vars.SMTP_TLS_REJECT_UNAUTHORIZED || 'true' }}
          SMTP_CONNECTION_TIMEOUT_MS: ${{ vars.SMTP_CONNECTION_TIMEOUT_MS || '10000' }}
          SMTP_SOCKET_TIMEOUT_MS: ${{ vars.SMTP_SOCKET_TIMEOUT_MS || '30000' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ vars.MAIL_FROM || 'inclusive-hire <no-reply@inclusive-hire.org.kg>' }}
          STORAGE_DRIVER: ${{ vars.STORAGE_DRIVER || 'local' }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_REGION: ${{ vars.R2_REGION || 'auto' }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BACKUP_STORAGE_DRIVER: ${{ vars.BACKUP_STORAGE_DRIVER || 'local' }}
          BACKUP_R2_PREFIX: ${{ vars.BACKUP_R2_PREFIX || 'backups/mongodb' }}
          AWS_CLI_IMAGE: ${{ vars.AWS_CLI_IMAGE || 'public.ecr.aws/aws-cli/aws-cli:latest' }}
        run: |
          write_env() {
            local value="${2//\'/\'\\\'\'}"
            printf "%s='%s'\n" "$1" "$value"
          }

          {
            write_env PUBLIC_SITE_URL "$PUBLIC_SITE_URL"
            write_env PUBLIC_APP_URL "$PUBLIC_APP_URL"
            write_env VITE_APP_BASE_URL "$VITE_APP_BASE_URL"
            write_env VITE_DEPLOY_TARGET app
            write_env VITE_BASE_PATH /
            write_env CLOUDFLARE_TUNNEL_TOKEN "$CLOUDFLARE_TUNNEL_TOKEN"
            write_env JWT_EXPIRES_IN "$JWT_EXPIRES_IN"
            write_env ADMIN_EMAILS "$ADMIN_EMAILS"
            write_env SMTP_HOST "$SMTP_HOST"
            write_env SMTP_PORT "$SMTP_PORT"
            write_env SMTP_SECURE "$SMTP_SECURE"
            write_env SMTP_REQUIRE_TLS "$SMTP_REQUIRE_TLS"
            write_env SMTP_TLS_REJECT_UNAUTHORIZED "$SMTP_TLS_REJECT_UNAUTHORIZED"
            write_env SMTP_CONNECTION_TIMEOUT_MS "$SMTP_CONNECTION_TIMEOUT_MS"
            write_env SMTP_SOCKET_TIMEOUT_MS "$SMTP_SOCKET_TIMEOUT_MS"
            write_env SMTP_USER "$SMTP_USER"
            write_env SMTP_PASS "$SMTP_PASS"
            write_env MAIL_FROM "$MAIL_FROM"
            write_env STORAGE_DRIVER "$STORAGE_DRIVER"
            write_env R2_ENDPOINT "$R2_ENDPOINT"
            write_env R2_BUCKET "$R2_BUCKET"
            write_env R2_REGION "$R2_REGION"
            write_env R2_ACCESS_KEY_ID "$R2_ACCESS_KEY_ID"
            write_env R2_SECRET_ACCESS_KEY "$R2_SECRET_ACCESS_KEY"
            write_env BACKUP_STORAGE_DRIVER "$BACKUP_STORAGE_DRIVER"
            write_env BACKUP_R2_PREFIX "$BACKUP_R2_PREFIX"
            write_env AWS_CLI_IMAGE "$AWS_CLI_IMAGE"
          } > "$DEPLOY_DIR/.env"

          printf '%s' '${{ secrets.MONGODB_PASSWORD }}' > "$DEPLOY_DIR/secrets/mongodb_password"
          printf '%s' '${{ secrets.JWT_SECRET }}' > "$DEPLOY_DIR/secrets/jwt_secret"
          chmod 600 "$DEPLOY_DIR/.env"
          chmod 644 "$DEPLOY_DIR/secrets/mongodb_password" "$DEPLOY_DIR/secrets/jwt_secret"

      - name: Deploy latest images
        working-directory: /opt/inclusive-hire
        run: |
          ./scripts/check-env.sh --require-tunnel
          docker compose -f compose.yaml -f compose.homelab.yaml pull api web
          docker compose -f compose.yaml -f compose.homelab.yaml up -d --remove-orphans
          docker compose -f compose.yaml -f compose.homelab.yaml restart nginx cloudflared
          docker compose -f compose.yaml -f compose.homelab.yaml ps

      - name: Verify app health
        working-directory: /opt/inclusive-hire
        env:
          COMPOSE_FILE: compose.yaml:compose.homelab.yaml
        run: |
          ./scripts/check-runtime.sh
