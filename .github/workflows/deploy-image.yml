name: Deploy images

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "web/**"
      - "compose*.yaml"
      - ".env.example"
      - ".env.homelab.example"
      - "deploy/**"
      - "scripts/**"
      - ".github/workflows/deploy-image.yml"
      - ".github/workflows/deploy-laptop.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/inclusive-hire-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/inclusive-hire-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:latest
            ${{ env.API_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          build-args: |
            PUBLIC_SITE_URL=${{ vars.PUBLIC_SITE_URL || 'https://inclusive-hire.org.kg' }}
            VITE_APP_BASE_URL=${{ vars.PUBLIC_APP_URL || 'https://app.inclusive-hire.org.kg' }}
            VITE_DEPLOY_TARGET=app
            VITE_BASE_PATH=/
          tags: |
            ${{ env.WEB_IMAGE }}:latest
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
