services:
  mongodb:
    image: mongo:7
    container_name: inclusive-hire-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: inclusive_hire
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongodb_password
    secrets:
      - mongodb_password
    volumes:
      - mongodb_data:/data/db
    networks:
      - inclusive_hire_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: inclusive-hire-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - inclusive_hire_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    image: inclusive-hire-api:latest
    container_name: inclusive-hire-api
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_USERNAME: inclusive_hire
      MONGODB_DATABASE: inclusive_hire
      MONGODB_PASSWORD_FILE: /run/secrets/mongodb_password
      REDIS_URL: redis://redis:6379
      JWT_SECRET_FILE: /run/secrets/jwt_secret
    secrets:
      - mongodb_password
      - jwt_secret
    volumes:
      - api_uploads:/app/uploads
    networks:
      - inclusive_hire_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: inclusive-hire-web:latest
    container_name: inclusive-hire-web
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - inclusive_hire_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    container_name: inclusive-hire-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - inclusive_hire_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  mongodb_data:
  redis_data:
  api_uploads:

networks:
  inclusive_hire_net:
    driver: bridge

secrets:
  mongodb_password:
    file: ./secrets/mongodb_password
  jwt_secret:
    file: ./secrets/jwt_secret
